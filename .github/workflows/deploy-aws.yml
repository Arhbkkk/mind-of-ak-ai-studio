name: Deploy to AWS EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aws-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
          SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AWS_EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing AWS_EC2_HOST" && exit 1)
          test -n "$EC2_USER" || (echo "Missing AWS_EC2_USER" && exit 1)
          test -n "$SSH_KEY" || (echo "Missing AWS_EC2_SSH_KEY" && exit 1)
          test -n "$KNOWN_HOSTS" || (echo "Missing AWS_EC2_KNOWN_HOSTS" && exit 1)
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AWS_EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" 'set -eu
            cd "$HOME/mind-of-ak-ai-studio"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build
            docker compose ps
            curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          '
