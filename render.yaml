services:
  - type: web
    name: mind-of-ak-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_SOURCE_DURATION_SECONDS
        value: "180"
      - key: MAX_RENDER_EDGE
        value: "640"
      - key: JOB_DB_PATH
        value: /tmp/mind-of-ak-jobs.sqlite3
