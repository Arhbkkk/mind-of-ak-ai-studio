services:
  - type: web
    name: mind-of-ak-ai-studio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_SOURCE_DURATION_SECONDS
        value: "180"
      - key: TEMP_FILE_MAX_AGE_SECONDS
        value: "43200"
