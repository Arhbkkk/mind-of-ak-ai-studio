services:
  - type: web
    name: mind-of-ak-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_UPLOAD_MB
        value: "512"
      - key: MAX_SOURCE_DURATION_SECONDS
        value: "600"
      - key: MAX_RENDER_EDGE
        value: "640"
      - key: JOB_DB_PATH
        value: /tmp/mind-of-ak-jobs.sqlite3
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://studio.ammaappallub.workers.dev,https://mind-of-ak-ai-studio.onrender.com
      - key: MAX_DIRECT_UPLOAD_MB
        value: "512"
